name: Tauri Quality Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tauri-quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install dependencies
        run: |

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run quality gate
        timeout-minutes: 20
        run: npm run check
  native-pr-checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NATIVE_PR_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Install native Rust target
        run: |
          rustup show
          rustup target add "$NATIVE_PR_TARGET"

      - name: Install locked Node dependencies and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run Clippy for native Tauri target
        timeout-minutes: 15
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml \
            --target "$NATIVE_PR_TARGET" --all-targets --all-features -- -D warnings

      - name: Run native Tauri Rust regression tests
        timeout-minutes: 20
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml \
            --target "$NATIVE_PR_TARGET" --all-targets --all-features
