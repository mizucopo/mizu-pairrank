name: Tauri Distribution Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      publish: ${{ steps.prepare.outputs.publish || 'false' }}
      release_sha: ${{ steps.prepare.outputs.release_sha }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - name: Validate release branch
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::Release requires main. Select the main branch when running this workflow manually.'
            exit 1
          fi
      - name: Checkout control code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Number latest main and reserve its tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: "\u307f\u305a"
          GIT_AUTHOR_EMAIL: "mizu.copo@gmail.com"
          GIT_COMMITTER_NAME: "\u307f\u305a"
          GIT_COMMITTER_EMAIL: "mizu.copo@gmail.com"
        run: python3 -I .github/scripts/release.py prepare

  preflight:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ needs.prepare.outputs.release_sha }}
      needs_build: ${{ steps.decision.outputs.needs_build }}
      zip_prefix: ${{ steps.metadata.outputs.zip_prefix }}
      is_prerelease: ${{ steps.metadata.outputs.is_prerelease }}
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      tag_exists: ${{ steps.release-state.outputs.tag_exists }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify numbering commit and read publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_PLAN_OUTPUT="$RUNNER_TEMP/release-plan.json"
          printf 'RELEASE_PLAN_OUTPUT=%s\n' "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_ENV"
          python3 -I .github/scripts/release.py plan

      - name: Prepare release asset names
        id: metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_EVENT_PATH:-}" ]; then
            echo "::error::GITHUB_EVENT_PATH is required to name Tauri distribution ZIPs."
            exit 1
          fi
          if ! release_repository="$(
            jq --exit-status --raw-output --slurp '
              if length == 1 then .[0].repository.full_name else null end
              | select(type == "string")
              | select(test("\\A[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\\z"))
            ' "$GITHUB_EVENT_PATH"
          )"; then
            echo "::error::Could not read a valid push event repository.full_name."
            exit 1
          fi
          # Preserve the original ZIP names when the same push is rerun after a rename.
          repository_name="${release_repository#*/}"
          echo "zip_prefix=$repository_name-$VERSION" >> "$GITHUB_OUTPUT"
          is_prerelease="$(jq -er '.publication.is_prerelease | select(type == "boolean") | tostring' "$RELEASE_PLAN_OUTPUT")"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Inspect release state
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_ASSET_NAMES: "${{ steps.metadata.outputs.zip_prefix }}-windows-x64.zip|${{ steps.metadata.outputs.zip_prefix }}-windows-arm64.zip|${{ steps.metadata.outputs.zip_prefix }}-macos-arm64.zip"
          INSPECT_DRAFT_RELEASES: "true"
        run: |
          set -euo pipefail

          git fetch --force --tags

          HEAD_SHA="$(git rev-parse HEAD)"
          tag_exists=false
          release_exists=false
          release_asset_exists=false
          release_is_draft=false
          release_id=

          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Tag $TAG already points to $TAG_SHA, not $HEAD_SHA."
              exit 1
            fi
            tag_exists=true
          fi

          RELEASE_RESPONSE="$(mktemp)"
          trap 'rm -f "$RELEASE_RESPONSE"' EXIT

          set +e
          RELEASE_HTTP_STATUS="$(
            curl --silent --show-error --location \
              --output "$RELEASE_RESPONSE" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
          )"
          CURL_STATUS=$?
          set -e

          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "::error::Could not inspect GitHub Release $TAG."
            exit "$CURL_STATUS"
          fi

          case "$RELEASE_HTTP_STATUS" in
            200)
              release_exists=true
              ;;
            404)
              ;;
            *)
              echo "::error::Could not inspect GitHub Release $TAG: HTTP $RELEASE_HTTP_STATUS."
              exit 1
              ;;
          esac

          if [ "${INSPECT_DRAFT_RELEASES:-false}" = "true" ]; then
            # The tag endpoint returns published releases only. Always include every page
            # of the authenticated listing to detect drafts and duplicate matching tags.
            if ! gh api --paginate --slurp \
              "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq --arg tag "$TAG" \
                '[.[][] | select(.tag_name == $tag)] |
                 if length == 0 then null
                 elif length == 1 then .[0]
                 else error("Multiple GitHub Releases match the tag") end' \
                > "$RELEASE_RESPONSE"; then
              echo "::error::Could not inspect draft GitHub Releases for $TAG."
              exit 1
            fi
            if [ "$(jq -r '. != null' "$RELEASE_RESPONSE")" = "true" ]; then
              release_exists=true
            fi

            if [ "$release_exists" = "true" ]; then
              if ! release_id="$(jq -er '.id | select(type == "number" and . > 0 and floor == .)' "$RELEASE_RESPONSE")" \
                || ! release_is_draft="$(jq -er '.draft | select(type == "boolean") | tostring' "$RELEASE_RESPONSE")" \
                || ! jq -e --arg tag "$TAG" '.tag_name == $tag and (.assets | type == "array")' "$RELEASE_RESPONSE" > /dev/null; then
                echo "::error::GitHub Release $TAG returned invalid release metadata."
                exit 1
              fi
            fi
          fi

          if [ "$release_exists" = "true" ] && [ "$tag_exists" != "true" ]; then
            echo "::error::GitHub Release $TAG exists, but the matching git tag was not found."
            exit 1
          fi

          if [ -n "${RELEASE_ASSET_NAME:-}" ] && [ -n "${RELEASE_ASSET_NAMES:-}" ]; then
            echo "::error::Specify only one release asset input."
            exit 1
          fi

          if [ "$release_exists" = "true" ] && [ -n "${RELEASE_ASSET_NAME:-}${RELEASE_ASSET_NAMES:-}" ]; then
            if [ -n "${RELEASE_ASSET_NAMES:-}" ]; then
              IFS='|' read -r -a expected_assets <<< "$RELEASE_ASSET_NAMES"
            else
              expected_assets=("$RELEASE_ASSET_NAME")
            fi
            release_asset_exists=true
            for asset_name in "${expected_assets[@]}"; do
              if [ -z "$asset_name" ]; then
                echo "::error::Release asset name must not be empty."
                exit 1
              fi
              if ! asset_exists="$(
                jq -r --arg name "$asset_name" \
                  --argjson require_uploaded "${INSPECT_DRAFT_RELEASES:-false}" \
                  'any(.assets[]?; .name == $name and
                    ($require_uploaded == false or
                     (.state == "uploaded" and (.size | type == "number" and . > 0))))' \
                  "$RELEASE_RESPONSE"
              )"; then
                echo "::error::Could not inspect assets for GitHub Release $TAG."
                exit 1
              fi
              case "$asset_exists" in
                true) ;;
                false) release_asset_exists=false ;;
                *)
                  echo "::error::GitHub Release $TAG returned an invalid asset state."
                  exit 1
                  ;;
              esac
            done
          fi

          {
            echo "tag_exists=$tag_exists"
            echo "release_exists=$release_exists"
            echo "release_asset_exists=$release_asset_exists"
            if [ "${INSPECT_DRAFT_RELEASES:-false}" = "true" ]; then
              echo "release_is_draft=$release_is_draft"
              echo "release_id=$release_id"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Reject incomplete immutable release
        if: steps.release-state.outputs.release_exists == 'true' && steps.release-state.outputs.release_is_draft != 'true' && steps.release-state.outputs.release_asset_exists != 'true'
        run: |
          echo "::error::GitHub Release is missing one or more Tauri distribution ZIP assets."
          exit 1

      - name: Decide whether to build
        id: decision
        env:
          RELEASE_ASSET_EXISTS: ${{ steps.release-state.outputs.release_asset_exists }}
        run: |
          if [ "$RELEASE_ASSET_EXISTS" = "true" ]; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    env:
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    needs: preflight
    if: needs.preflight.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify numbering commit and read publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_PLAN_OUTPUT="$RUNNER_TEMP/release-plan.json"
          printf 'RELEASE_PLAN_OUTPUT=%s\n' "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_ENV"
          python3 -I .github/scripts/release.py plan

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run quality gate
        run: npm run check

  build:
    needs: [preflight, quality]
    if: needs.preflight.outputs.needs_build == 'true'
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
    env:
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      RUST_TARGET: ${{ matrix.target }}
      ARTIFACT_PLATFORM: ${{ matrix.platform }}
      ZIP_PREFIX: ${{ needs.preflight.outputs.zip_prefix }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup show
          rustup target add "$RUST_TARGET"

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Windows application
        if: runner.os == 'Windows'
        shell: bash
        run: npm run tauri -- build --target "$RUST_TARGET" --no-bundle

      - name: Build macOS application
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target "$RUST_TARGET" --bundles app

      - name: Create Windows distribution ZIP
        if: runner.os == 'Windows'
        id: windows-zip
        shell: pwsh
        run: |
          $metadata = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not locate the Cargo target directory." }
          $releaseDir = Join-Path (Join-Path $metadata.target_directory $env:RUST_TARGET) "release"
          $applications = @(Get-ChildItem -LiteralPath $releaseDir -Filter "*.exe" -File)
          if ($applications.Count -ne 1) { throw "Expected exactly one Windows application in $releaseDir." }
          $artifactDir = Join-Path $env:RUNNER_TEMP "tauri-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $zipPath = Join-Path $artifactDir "$($env:ZIP_PREFIX)-$($env:ARTIFACT_PLATFORM).zip"
          Compress-Archive -LiteralPath $applications[0].FullName -DestinationPath $zipPath
          "path=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Create macOS distribution ZIP
        if: runner.os == 'macOS'
        id: macos-zip
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          cargo_target_dir="$(
            cd src-tauri
            cargo metadata --no-deps --format-version 1 |
              node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).target_directory'
          )"
          bundle_dir="$cargo_target_dir/$RUST_TARGET/release/bundle/macos"
          applications=("$bundle_dir"/*.app)
          if [ "${#applications[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS application in $bundle_dir."
            exit 1
          fi
          artifact_dir="$RUNNER_TEMP/tauri-artifacts"
          mkdir -p "$artifact_dir"
          ditto -c -k --keepParent "${applications[0]}" \
            "$artifact_dir/$ZIP_PREFIX-$ARTIFACT_PLATFORM.zip"
          echo "path=$artifact_dir/$ZIP_PREFIX-$ARTIFACT_PLATFORM.zip" >> "$GITHUB_OUTPUT"

      - name: Upload distribution ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.windows-zip.outputs.path || steps.macos-zip.outputs.path }}
          archive: false
          if-no-files-found: error

  publish:
    env:
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    permissions:
      contents: write
    needs: [preflight, quality, build]
    if: ${{ always() && needs.preflight.result == 'success' && ((needs.preflight.outputs.needs_build == 'false' && needs.quality.result == 'skipped' && needs.build.result == 'skipped') || (needs.preflight.outputs.needs_build == 'true' && needs.quality.result == 'success' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify numbering commit and read publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_PLAN_OUTPUT="$RUNNER_TEMP/release-plan.json"
          printf 'RELEASE_PLAN_OUTPUT=%s\n' "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_ENV"
          python3 -I .github/scripts/release.py plan

      - name: Download distribution ZIPs
        if: needs.preflight.outputs.needs_build == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.preflight.outputs.zip_prefix }}-*.zip
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
          skip-decompress: true

      - name: Verify distribution ZIPs
        if: needs.preflight.outputs.needs_build == 'true'
        env:
          ZIP_PREFIX: ${{ needs.preflight.outputs.zip_prefix }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-assets"
          if [ "$(find "$artifact_dir" -maxdepth 1 -type f | wc -l)" -ne 3 ]; then
            echo "::error::Expected exactly three distribution ZIPs."
            exit 1
          fi
          for platform in windows-x64 windows-arm64 macos-arm64; do
            zip_path="$artifact_dir/$ZIP_PREFIX-$platform.zip"
            if [ ! -s "$zip_path" ]; then
              echo "::error::Missing distribution ZIP: $zip_path"
              exit 1
            fi
            unzip -tq "$zip_path"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.release_tag }}
          ZIP_PREFIX: ${{ needs.preflight.outputs.zip_prefix }}
          IS_PRERELEASE: ${{ needs.preflight.outputs.is_prerelease }}
          INSPECT_DRAFT_RELEASES: "true"
        run: |
          RELEASE_ASSET_NAMES="$ZIP_PREFIX-windows-x64.zip|$ZIP_PREFIX-windows-arm64.zip|$ZIP_PREFIX-macos-arm64.zip"
          inspect_release_state() {
            set -euo pipefail

            git fetch --force --tags

            HEAD_SHA="$(git rev-parse HEAD)"
            tag_exists=false
            release_exists=false
            release_asset_exists=false
            release_is_draft=false
            release_id=

            if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
              TAG_SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
              if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
                echo "::error::Tag $TAG already points to $TAG_SHA, not $HEAD_SHA."
                exit 1
              fi
              tag_exists=true
            fi

            RELEASE_RESPONSE="$(mktemp)"
            trap 'rm -f "$RELEASE_RESPONSE"' EXIT

            set +e
            RELEASE_HTTP_STATUS="$(
              curl --silent --show-error --location \
                --output "$RELEASE_RESPONSE" \
                --write-out '%{http_code}' \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG"
            )"
            CURL_STATUS=$?
            set -e

            if [ "$CURL_STATUS" -ne 0 ]; then
              echo "::error::Could not inspect GitHub Release $TAG."
              exit "$CURL_STATUS"
            fi

            case "$RELEASE_HTTP_STATUS" in
              200)
                release_exists=true
                ;;
              404)
                ;;
              *)
                echo "::error::Could not inspect GitHub Release $TAG: HTTP $RELEASE_HTTP_STATUS."
                exit 1
                ;;
            esac

            if [ "${INSPECT_DRAFT_RELEASES:-false}" = "true" ]; then
              # The tag endpoint returns published releases only. Always include every page
              # of the authenticated listing to detect drafts and duplicate matching tags.
              if ! gh api --paginate --slurp \
                "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                | jq --arg tag "$TAG" \
                  '[.[][] | select(.tag_name == $tag)] |
                   if length == 0 then null
                   elif length == 1 then .[0]
                   else error("Multiple GitHub Releases match the tag") end' \
                  > "$RELEASE_RESPONSE"; then
                echo "::error::Could not inspect draft GitHub Releases for $TAG."
                exit 1
              fi
              if [ "$(jq -r '. != null' "$RELEASE_RESPONSE")" = "true" ]; then
                release_exists=true
              fi

              if [ "$release_exists" = "true" ]; then
                if ! release_id="$(jq -er '.id | select(type == "number" and . > 0 and floor == .)' "$RELEASE_RESPONSE")" \
                  || ! release_is_draft="$(jq -er '.draft | select(type == "boolean") | tostring' "$RELEASE_RESPONSE")" \
                  || ! jq -e --arg tag "$TAG" '.tag_name == $tag and (.assets | type == "array")' "$RELEASE_RESPONSE" > /dev/null; then
                  echo "::error::GitHub Release $TAG returned invalid release metadata."
                  exit 1
                fi
              fi
            fi

            if [ "$release_exists" = "true" ] && [ "$tag_exists" != "true" ]; then
              echo "::error::GitHub Release $TAG exists, but the matching git tag was not found."
              exit 1
            fi

            if [ -n "${RELEASE_ASSET_NAME:-}" ] && [ -n "${RELEASE_ASSET_NAMES:-}" ]; then
              echo "::error::Specify only one release asset input."
              exit 1
            fi

            if [ "$release_exists" = "true" ] && [ -n "${RELEASE_ASSET_NAME:-}${RELEASE_ASSET_NAMES:-}" ]; then
              if [ -n "${RELEASE_ASSET_NAMES:-}" ]; then
                IFS='|' read -r -a expected_assets <<< "$RELEASE_ASSET_NAMES"
              else
                expected_assets=("$RELEASE_ASSET_NAME")
              fi
              release_asset_exists=true
              for asset_name in "${expected_assets[@]}"; do
                if [ -z "$asset_name" ]; then
                  echo "::error::Release asset name must not be empty."
                  exit 1
                fi
                if ! asset_exists="$(
                  jq -r --arg name "$asset_name" \
                    --argjson require_uploaded "${INSPECT_DRAFT_RELEASES:-false}" \
                    'any(.assets[]?; .name == $name and
                      ($require_uploaded == false or
                       (.state == "uploaded" and (.size | type == "number" and . > 0))))' \
                    "$RELEASE_RESPONSE"
                )"; then
                  echo "::error::Could not inspect assets for GitHub Release $TAG."
                  exit 1
                fi
                case "$asset_exists" in
                  true) ;;
                  false) release_asset_exists=false ;;
                  *)
                    echo "::error::GitHub Release $TAG returned an invalid asset state."
                    exit 1
                    ;;
                esac
              done
            fi

            {
              echo "tag_exists=$tag_exists"
              echo "release_exists=$release_exists"
              echo "release_asset_exists=$release_asset_exists"
              if [ "${INSPECT_DRAFT_RELEASES:-false}" = "true" ]; then
                echo "release_is_draft=$release_is_draft"
                echo "release_id=$release_id"
              fi
            } >> "$GITHUB_OUTPUT"


          }
          inspect_release_state

          if [ "$release_exists" != "true" ]; then
            if [ "$tag_exists" != "true" ]; then
              echo "::error::Git tag $TAG must exist before creating a GitHub Release."
              exit 1
            fi
            # Retain the created draft identity; it may not appear in the listing yet.
            gh api --method POST "/repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="$TAG" \
              -f body="Tauri application ZIPs for Windows x64, Windows ARM64, and macOS ARM64." \
              -F draft=true -F prerelease="$IS_PRERELEASE" -f make_latest=false \
              > "$RELEASE_RESPONSE"
            if ! release_id="$(jq -er '.id | select(type == "number" and . > 0 and floor == .)' "$RELEASE_RESPONSE")" \
              || ! jq -e --arg tag "$TAG" --argjson prerelease "$IS_PRERELEASE" \
                '.tag_name == $tag and .draft == true and .prerelease == $prerelease and
                 (.assets | type == "array")' "$RELEASE_RESPONSE" > /dev/null; then
              echo "::error::Created GitHub Release $TAG returned invalid release metadata."
              exit 1
            fi
            release_is_draft=true
          fi

          if [ "$release_is_draft" != "true" ]; then
            if [ "$release_asset_exists" != "true" ]; then
              echo "::error::GitHub Release is missing one or more Tauri distribution ZIP assets."
              exit 1
            fi
            exit 0
          fi

          upload_url="$(jq -er '.upload_url | select(type == "string" and length > 0) | split("{")[0]' "$RELEASE_RESPONSE")"
          artifact_dir="$RUNNER_TEMP/release-assets"
          for platform in windows-x64 windows-arm64 macos-arm64; do
            asset_name="$ZIP_PREFIX-$platform.zip"
            if [ "$(jq -r --arg name "$asset_name" \
              'any(.assets[]; .name == $name and .state == "uploaded" and
                (.size | type == "number" and . > 0))' \
              "$RELEASE_RESPONSE")" != "true" ]; then
              # Replace only incomplete assets, using IDs rather than another tag lookup.
              asset_ids="$(jq -r --arg name "$asset_name" \
                '[.assets[] | select(.name == $name) | .id] |
                 if all(.[]; type == "number" and . > 0 and floor == .)
                 then .[] else error("Invalid release asset ID") end' \
                "$RELEASE_RESPONSE")"
              for asset_id in $asset_ids; do
                gh api --method DELETE "/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              done
              asset_query="$(jq -rn --arg name "$asset_name" '$name | @uri')"
              gh api --method POST "$upload_url?name=$asset_query" \
                -H 'Content-Type: application/zip' --input "$artifact_dir/$asset_name"
            fi
          done

          gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RELEASE_RESPONSE"
          if ! jq -e --arg tag "$TAG" --argjson id "$release_id" \
            --arg names "$RELEASE_ASSET_NAMES" \
            '.id == $id and .tag_name == $tag and .draft == true and
             (.assets as $assets | all($names | split("|")[];
               . as $name | any($assets[];
                 .name == $name and .state == "uploaded" and
                 (.size | type == "number" and . > 0))))' \
            "$RELEASE_RESPONSE" > /dev/null; then
            echo "::error::Draft GitHub Release $TAG is not ready for publication."
            exit 1
          fi
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$IS_PRERELEASE" \
            -f make_latest=false

  promote-latest:
    env:
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
    outputs:
      promoted: ${{ steps.latest-state.outputs.promote_latest }}
    permissions:
      contents: write
    needs: [preflight, publish]
    # Completed assets skip quality/build on a full rerun.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.publish.result == 'success' && needs.preflight.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 0

      - name: Verify numbering commit and read publication data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_PLAN_OUTPUT="$RUNNER_TEMP/release-plan.json"
          printf 'RELEASE_PLAN_OUTPUT=%s\n' "$RELEASE_PLAN_OUTPUT" >> "$GITHUB_ENV"
          python3 -I .github/scripts/release.py plan

      - name: Read latest release
        id: latest-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/release.py latest

      - name: Mark GitHub Release as latest
        if: steps.latest-state.outputs.promote_latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.latest-state.outputs.release_tag }}
        run: gh release edit "$TAG" --latest

  notify-homebrew:
    needs: [preflight, promote-latest]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.preflight.result == 'success' && needs.promote-latest.result == 'success' && needs.promote-latest.outputs.promoted == 'true' && !contains(needs.preflight.outputs.version, '-') && !contains(needs.preflight.outputs.version, '+') && vars.HOMEBREW_TAP_NOTIFY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Create short-lived Tap notification token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The pinned v3 action prefers client-id; app-id is deprecated.
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: "mizucopo"
          repositories: "homebrew-tap"
          permission-actions: write

      - name: Request Tap reconciliation after release publication
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAP_REPOSITORY: "mizucopo/homebrew-tap"
          TAP_WORKFLOW: "update-casks.yml"
        run: |
          set -euo pipefail
          # The Tap independently verifies all registered published releases.
          # No release title, body, tag, URL or checksum is treated as authority.
          # Duplicate requests are safe if the first response is lost.
          for attempt in 1 2 3; do
            if gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/$TAP_REPOSITORY/actions/workflows/$TAP_WORKFLOW/dispatches" \
              --input - <<'JSON'
          {"ref":"main","inputs":{"apply":"true"}}
          JSON
            then
              echo 'Tap reconciliation requested; check its workflow run for the publication result.'
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo '::error::Tap notification failed. Rerun this failed job or run the Tap workflow manually.'
          exit 1
